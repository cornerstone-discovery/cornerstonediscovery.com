<section id="testimonials">
  <div id="testimonial_carousel" class="carousel slide" data-ride="carousel" data-interval="7000" aria-roledescription="carousel" aria-label="Client testimonials">
    <div class="carousel-inner">
      {%- for t in site.data.testimonials %}
      <div class="item{% if forloop.first %} active{% endif %}" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ forloop.length }}">
        <div class="container">
          <div class="carousel-caption">
            <div class="h3"><i class="fa fa-quote-left turq fa-fw" aria-hidden="true"></i> {{ t.quote }} <i class="fa fa-quote-right turq fa-fw" aria-hidden="true"></i></div>
            <div class="row">
              <div class="col-xs-6 text-right">
                <div class="h4">{{ t.name }}</div>
                <p>{{ t.title }}</p>
              </div>
              <div class="col-xs-6">
                <p>{% if t.url %}<a href="{{ t.url }}" target="_blank" rel="noopener">{% endif %}<img src="{{ t.logo | relative_url }}" class="img-responsive" alt="{{ t.org }}" loading="lazy" decoding="async">{% if t.url %}</a>{% endif %}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      {%- endfor %}
    </div>
    <a class="left carousel-control" href="#testimonial_carousel" role="button" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span><span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#testimonial_carousel" role="button" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span><span class="sr-only">Next</span>
    </a>
  </div>
</section>
