# About Us team roster (ported from the WordPress ACF repeater). Order = display order.
- first: Jason
  last: Silva
  profile: /about-us/jason-silva/
  profile_role: Managing Director, Digital Forensic Examiner
  position: MANAGING DIRECTOR, ADMITTED & CERTIFIED DIGITAL FORENSIC EXAMINER
  image: /assets/i/bio_jason.jpg
  bio: '<p>Jason has been admitted in State and Federal courts as a Digital Forensic Expert. Joining the Cornerstone Discovery team in 2010, Jason became a dedicated partner with founder Louis Cinquanto, establishing a rigorous work ethic and desire to advance the company via technical innovation. Today, Jason is the Managing Director whose meticulous attention to detail and strong leadership skills benefit the Cornerstone team and clients alike.</p><p>Jason graduated from Drexel University with a Bachelor of Computer Science degree from the College of Engineering. He is an ACE Certified Forensic Examiner and an admitted expert, testifying in both depositions and courtrooms in the area of Digital Forensics. Jason works alongside Cornerstone''s executive team to strategically develop new services and software applications. Jason was responsible for the development and successful launch of Cornerstone''s e-discovery software solution, <a href="https://junto.net" title="Junto">Junto.net.</a>
    He is also involved in hiring and training new employees, directing the growing Cornerstone team to stay focused on delivering top notch customer service at all times.</p><p>Jason has taken the initiative to continue his education at both national and international conferences, proactively enhancing his skills in technical application and forensic expertise. Jason prides himself on keeping up to date with new and emerging forensic methods and best practices. He is passionate about educating others in the many aspects of Digital Forensics; he has lectured at Widener Law School, Drexel University and Wilmington University, and has taken part in various CLE panel discussions at the Pennsylvania Bar Institute and other venues. Jason has been featured in various publications including "Legal IT Professionals", Philly.com news articles, and The Tech Gazette, Cornerstone''s forensic and e-discovery blog.</p><p>In his free time, you''ll find Jason regularly engaging in Crossfit training and
    OLY weightlifting. He enjoys competing in local strength and endurance competitions such as a local Civilian Military Combine, Spartan races and local crossfit competitions. In addition, Jason donates his time to various individuals and nonprofit causes, leveraging his technical aptitude to help build websites and offer consulting services. Currently, Jason and wife Amanda reside in Delaware with their two rescue dogs, Lincoln, a collie/boxer/pitbull mix, and Webster, a blue Staffordshire pitbull (Dog Instagram: <a href="https://www.instagram.com/Lincoln.Webster" title="Follow Lincoln + Webster on Instagram">@Lincoln.Webster</a>).</p>'
- first: Robert
  last: Centofanti
  position: Chief Business Officer
  image: /assets/i/bio_rob.jpg
  bio: <p>A modern renaissance man in every sense of the word. Robert Centofanti was born in the U.S. but was raised both in the States and Italy. He speaks English and Italian fluently and is a dual citizen. Originally, Rob attended Neumann University in Pennsylvania then continued his studies abroad with a focus on International Business and Finance.</p><p>Early on in his career, Rob quickly put his education to work as Floor Manager of his family's highly renowned Italian restaurants, <i>La Veranda, Ara Pacis, and Bar Centofanti.</i> He also pursued his interest in business and finance and started his own investment holding company as a registered equities trader. A people person with excellent communication and customer relations skills, Rob joined the Cornerstone executive team in 2015.</p><p>No stranger to technology, he quickly familiarized himself with Cornerstone's internal processes, procedures, and service offerings. Today, Rob focuses on client relations and account
    management. Throughout the year you'll find him representing Cornerstone at nationwide legal trade shows and events. He also oversees various administrative functions such as billing and client invoicing. Working closely with the rest of the executive team, Rob keeps his finger on the pulse of the Company. He is heavily involved with reviewing company financials, reporting, and shaping Cornerstone's strategic vision.</p><p>A natural conversationalist, Rob is known to enjoy a scotch with clients or friends, but don't be surprised to have the discussion turn to soccer, hockey, or European sports cars. He also loves classic Italian food, sampling wine from local vineyards, and spending time with his extended family at the dinner table. In his spare time you'll often find Rob traveling abroad with his wife Julia or returning to his Italian roots by visiting friends and family in Roma, Italia. Arrivederci!</p>
- first: Grady
  last: Walters
  position: DIRECTOR, TRIAL SUPPORT SERVICES
  image: /assets/i/bio_grady.jpg
  bio: <p>Grady's early interests in art and media after high school led him to Penn State University where he received a Bachelor of Arts in Advertising from the College of Communications. During college and into the early years of his career Grady proudly served his country as an enlisted soldier in the United States Army Reserves. He was promoted to the rank of Sergeant after six years of service. Immediately upon graduation from Penn State, Grady headed to the Big Apple to pursue a career in advertising. Over the course of seven years, Grady successfully worked in account management as an executive at global agency giants Ammirati Puris Lintas and Lowe &amp; Partners. His clients included Fortune 100 companies such as IBM, Dell Technologies and Verizon.</p><p>After 2003, Grady was recruited by a Philadelphia-based marketing communications agency and happily returned to his roots in Pennsylvania. For the next decade, he worked as a senior marketing executive and as a consultant on several
    technology accounts including OKI, Hewlett-Packard and Kaspersky Lab. With a breadth of marketing and advertising experience under his belt and an affinity towards technology, it wasn't until 2014 that Grady decided to tweak his career path.</p><p>Grady joined Cornerstone Legal Consultants in 2014 as Director of Marketing. His first major challenge was to rebrand the company and its proprietary online document review platform. His second challenge was to play a vital role in the company's Trial Support Division. In 2015, Cornerstone Discovery and <a href="https://junto.net" title="Junto.net e-Discovery Just got Easier.">Junto.net</a> were successfully launched at LegalTech New York. Today, Cornerstone Discovery is now being recognized as the best full-service litigation support company in the tri-state area. Furthermore, Grady works alongside Cornerstone's executive team to create annual marketing plans and shape the company's strategic vision.</p><p>In 2018, Grady became Cornerstone
    Discovery's Director of Trial Support Services. While Grady still drives all marketing and advertising initiatives for Cornerstone his primary focus is now Trial Support. To date, Grady has completed tens of thousands of hours supporting Civil and Criminal trials in both State and Federal courts throughout the country. Grady prides himself on dedicated project management, strong communication, attention to detail and precise execution. From trial preparation to execution in the courtroom, Grady's services are in high demand. Trial attorneys continuously seek out his services especially when it comes to the creation and execution of opening and closing arguments. Once the facts are in, it's all about the art of persuasion! Now that's something you should expect from a marketing guy. No?</p><p>Grady currently resides in Pennsylvania with his wife, Irma and young son. When not working, Grady enjoys travelling with his family to experience new places, cultures and events. Whether it's taking
    a short trip to the New Jersey shore or catching a last-minute flight, Grady and his family love spending quality time together at the beach or any other fun-filled destination. In addition, Grady has a love for fine cooking, art, gardening, dogs and all things sports.</p>
- first: Shane
  last: Herrmann
  position: Director, e-Discovery Services
  image: /assets/i/bio_shane.jpg
  bio: <p>E-Discovery Specialist Shane Herrmann joined Cornerstone Discovery in 2014. Shane initially was hired to optimize Cornerstone Discovery's e-Discovery Platform, Junto®, as an Assistant Developer, helping our team identify application bugs and process flaws that inhibit the ultimate customer experience. He was soon recognized for his attention to detail and ability to deliver a high level of client service during client training sessions and to answer client service calls about Junto. From lawyers to paralegals alike, Shane is recognized for his ability to grasp new technical concepts, keen insights, and composure that empowers clients to access and quickly leverage state-of-the-art legal technology.</p><p>Shane's keen appreciation towards transforming data into information led him to study mathematics at Ursinus College. An instinctive problem-solver with a prominent interest in business, Shane graduated with a Bachelor of Science in Mathematics and minors in Statistics, Economics,
    and Management. Shane took on several leadership and training roles throughout his college and volunteer experience, further developing his natural talents and penchant towards assisting others.</p><p>Shane's innate ability to employ technology combined with his procedural fluency led him to Heraeus Precious Materials where he worked as a Service Lab Technician. During his time, Shane honed his skills performing material tests, creating reports, working with customer service teams and determining solutions to improve processes.</p><p>At Cornerstone Discovery, Shane's dedication to learning and staying at the forefront of new technology is demonstrated by his promotion to e-Discovery Specialist and his ACE and LAW PreDiscovery™ EDD credentials. Shane's inclination towards streamlining processes helps to improve office efficiencies, adding extreme value to Cornerstone's e-Discovery and Digital Forensic teams. Most recently, Shane has also been tasked with transitioning the e-Discovery
    Department to the Nuix integrated e-Discovery solution. Shane received his Nuix e-Discovery training certificate back in 2018 and is now considered Cornerstone's resident Nuix expert.</p><p>Shane's fervent mathematical proficiency extends even to his home where he is well known for creating complex spreadsheets for multiple fantasy drafts and leagues he participates in year-round. And when not crunching numbers or watching his beloved Flyers, Shane stays active in several recreational sports leagues, including basketball and softball. Best of all, when Shane has some time off you often find him out adventuring around town with his college sweetheart (Kathleen) and their four-legged friend, his Bernese Mountain dog, Charlie.</p>
- first: Joseph
  last: Sierra
  profile: /about-us/joseph-sierra/
  profile_role: Director, Digital Forensic Services; Cell Site Analysis
  position: Director, Digital Forensic Services
  image: /assets/i/bio_joe-s.jpg
  bio: <p>Joseph joined Cornerstone Discovery in 2020 and currently serves as Director of Forensic Services. A nationally recognized expert in cell-site analysis and digital evidence, Joe brings more than 15 years of experience examining complex cellular analysis records, mobile devices, various location evidence, and other forms of digital information.</p><p>In his role at Cornerstone, Joe oversees forensic operations while providing digital forensic analysis, litigation support, and expert-witness testimony. He specializes in mobile and location-based evidence and interpreting complex technical data. His ability to translate highly technical findings into clear, understandable conclusions helps attorneys, courts, and juries evaluate digital evidence with confidence.</p><p>Before joining Cornerstone, Joe spent 10 years with T-Mobile USA’s Law Enforcement Relations Department. He began his career there as a Legal Compliance Specialist, representing the company in judicial proceedings and serving as a liaison between T-Mobile and law-enforcement agencies throughout the investigative and litigation process. He ultimately advanced to Senior Testifier, managing a team of seven expert witnesses and developing policies and procedures designed to improve legal compliance operations.</p><p>T-Mobile’s senior leadership also selected Joe to lead external outreach and training initiatives. In that capacity, he conducted numerous training programs on cellular networks, historical call-detail records, location analysis, and cellular forensics for prosecutors’ offices and law-enforcement agencies, including the FBI.</p><p>During his tenure at T-Mobile, Joe reviewed and analyzed more than 6,000 cellular reports and provided testimony in more than 400 trials involving mobile-device data, GPS tracking, electronic surveillance (including pen-register, Title III, and FISA matters), and timing-advance evidence. He has been qualified as an expert witness in local, state, and federal courts throughout the United States in areas including cell-site and cellular-record analysis, radio-frequency principles, GPS and cellular triangulation, and cellular forensics.</p><p>Joe earned a Bachelor of Arts in Criminal Justice from Rutgers University. While working full time at T-Mobile, he earned a Master of Science in Criminology, with a concentration in Intelligence and Forensic Data Analysis, from Saint Joseph’s University, graduating magna cum laude. His interest in the intersection of law, investigations, and technology began during college, when he interned as a legal assistant with Garces, Grabler &amp; LeBrocq in New Brunswick, New Jersey.</p><p>Born and raised in New York City, Joe developed an early fascination with investigations, electronics, and understanding how things work. He began tinkering with technology at four years old and later built his first computer. He credits his aunt Sonia, who worked in information technology at the Federal Reserve, with helping transform that early curiosity into a lifelong passion for technology and innovation.</p><p>Joe now lives in Allentown, Pennsylvania, with his wife, Jessica, and their two children. He volunteers with Special Olympics as a snowboarding coach and is an active member of the Freemasons and Knights Templar, participating in community-outreach programs and philanthropic initiatives.</p><p>When he is not volunteering (or avoiding questions about the Illuminati), Joe enjoys traveling with his family, hiking, camping, and building high-performance gaming computers.</p>
- first: Fei
  last: Bao
  position: Lead Programmer & Database Administrator
  image: /assets/i/bio_fei.jpg
  bio: <p>Fei was born and raised in Shandong Province of the People's Republic of China. While living in China Fei attended South China University of Technology (SCUT) and received a bachelor's degree in Computer Science from the School of Computer Science and Engineering in 1999.</p><p>Early on in her career, Fei was employed as a police officer with the Guangdong Provincial Police Department, focusing on developing computer applications and programs for the various police divisions such as crime, traffic, and immigration.</p><p>Fei came to the United States in 2005 and eventually pursued a master's degree in computer engineering at Drexel University in Philadelphia, Pennsylvania. She joined Cornerstone Discovery in 2009 after graduation.</p><p>Her focus was to build a case management system for Cornerstone's large Federal criminal cases that would support the review of vast amounts of documents, audio and video. This system has greatly evolved over the years and is now known as <a href="https://junto.net"
    title="Junto | e-Discovery just got easier.">Junto.net</a>, Cornerstone's proprietary, online document review platform. Today, Fei is the lead programmer on Junto. She is responsible for developing new features, conducting routine maintenance, and any troubleshooting. When shifting gears, you'll often find Fei creating scripts to upload massive amounts of e-Discovery and archiving cases. Day or night, the e-Discovery team relies heavily on Fei's ability to keep all cases running smoothly on Junto.</p><p>Fei speaks both Mandarin and English fluently. She is also an Admitted Programming Expert in the Eastern District of Pennsylvania.</p><p>When Fei finds some rare free time, she loves spending it with her son, Danny or reading Chinese fiction online. In addition, Fei enjoys travelling abroad with family and eating authentic Chinese food and snacks.</p>
- first: Kyle
  last: McArdle
  profile: /about-us/kyle-mcardle/
  profile_role: Digital Forensic Examiner
  position: Certified & Admitted Digital Forensic Examiner
  image: /assets/i/kyle_bio.jpg
  bio: <p>Kyle can trace his skill in computer science back to his youth. As a child, Kyle's mother once returned from a visit to the library with a BASIC programming book. It took little effort for Kyle to complete the training directives and quickly develop the code to flip a virtual coin 100 times. Kyle's adept talent led him to Drexel University where he graduated with a bachelor's degree in Digital Media from the College of Media Arts and Design.</p><p>Upon graduation, Kyle accepted a competitive position at Lockheed Martin as a Simulation Developer. Kyle led Flash/Actionscript development for multiple projects in the iSim/e-Media department supporting the US Navy in various training programs. He was responsible for creating and maintaining project plans, managing groups of Flash developers, and using complex linear algebra equations to perform precise measurements. The depth and breadth of his experience prepared Kyle for his transition to Cornerstone Discovery. Kyle joined Cornerstone
    in 2012 as a Senior Developer.</p><p>As a full-stack developer and digital media expert, Kyle is at the forefront of modern age web programming specializing in several Javascript frameworks, HTML/CSS, Python, NodeJS, PHP, MSSQL, and many others. Most notably, Kyle led the development of several cutting-edge software programs that enhance Cornerstone's litigation support offerings, including the online e-Discovery platform <a href="https://junto.net" title="Junto | e-Discovery just got easier."><i>Junto.net</i></a> and exhibit management system <a href="https://docfol.io" title="Docfol.io | Exhibit management. Streamlined."><i>Docfol.io.</i></a></p><p>As you may have guessed, Kyle is always up for a challenge, anytime and anywhere. Kyle's expertise in digital media and high demand for Cornerstone's digital forensic services made Kyle's eventual transition to the digital forensics department a no brainer. Today, Kyle is a Certified Digital Forensic Examiner where he is responsible for the
    collection, preservation, and examination of electronically stored information (ESI) in Civil and Criminal matters. Need to crack a password? Decrypt a hard drive? How about obtain a "deleted" chat from Facebook messenger or voice history from Amazon Alexa? Passionate, proficient and cool under pressure, Kyle is an invaluable asset to the digital forensics team, especially when it comes to the ever expanding world of digital media.</p><p>When not at the office or behind a computer screen, Kyle is known for his keen eye behind the camera and love of vintage records. On some days, you might find him capturing the ever-changing Philadelphia skyline with his Nikon in hand or dominating as a local bocce ball league champion. An avid Quizzo player and self-proclaimed purveyor of good eats around the city, Kyle can usually be found surrounded by his friends and family eating good food and drinking quality beers.</p>
- first: Benjamen
  last: McCollum
  profile: /about-us/benjamen-mccollum/
  profile_role: Senior Digital Forensic Examiner
  suffix: ACE, CCME
  position: CERTIFIED & Admitted DIGITAL FORENSIC EXAMINER
  image: /assets/i/bio_ben.jpg
  bio: '<p>Benjamen “Ben” McCollum is a Senior Digital Forensic Examiner at Cornerstone Discovery, where he has worked since January 2016. He assists attorneys in civil and criminal matters nationwide through the collection, preservation, and examination of digital evidence. His work includes examining computers, mobile devices, and cloud services, as well as analyzing call detail records and historical cell site location information.</p><p>Ben has provided expert testimony in state and federal courts. He works with counsel to explain technical findings in clear terms, with attention to what the evidence supports and the limitations that may affect its interpretation. Before joining Cornerstone, he served as a Homicide Technical Services Specialist with the Philadelphia District Attorney’s Office, supporting homicide investigations through digital forensic analysis and technical trial support.</p><p>Ben earned a Bachelor of Science in Digital Forensics from Bloomsburg University of Pennsylvania. He holds the Certified Forensic Computer Examiner (CFCE), AccessData Certified Examiner (ACE), and Cellebrite Certified Mobile Examiner (CCME) credentials. His background also includes work in secure data migration, cloud systems, and technical support.</p><p>Ben is a husband and father of two. Outside of work, he enjoys spending time with his family and occasionally playing PC games.</p>'
- first: John
  last: Angelone
  position: OPERATIONS MANAGER
  image: /assets/i/bio-john-a.jpg
  bio: <p>Having graduated from Fairfield University, John joined the Cornerstone team in 2018. With a background in film &amp; television production, John lends his talents to our Digital Media department, creating demonstrative videos and graphics which attorneys rely on to help present their cases in court. If you need a high-quality video that incorporates video and/or photographic evidence to provide a step-by-step breakdown/narrative of events, who better to put on the case than someone with real-life Hollywood experience?</p><p>Aside from taking an active role in the Digital Media department, John has proven himself as an effective multitasker, communicator, and project manager. As such, John was recently promoted to Operations Manager, to assist in facilitating all of Cornerstone's administrative needs. His colleagues consider him the biological equivalent of the Swiss army knife, a “John of all trades,” if you will.</p><p>Outside of Cornerstone, John can usually be found shredding
    his electric guitar. In fact, he is the lead guitarist of legendary local Delco-based heavy metal band Tough Verdict. In his free time, John loves going to see live music, playing retro video games and writing/producing short comedic films. Besides that, he enjoys hiking and reconnecting with nature.</p>
- first: Justin
  last: Reed
  profile: /about-us/justin-reed/
  profile_role: Digital Forensic Examiner
  position: Certified & Admitted Digital Forensic Examiner
  image: /assets/i/bio-justin-r.jpg
  bio: <p>Justin Reed is a graduate of the Bloomsburg University of Pennsylvania with a degree in Digital Forensics and a minor in Computer Science and brings his technical prowess, forensic knowledge, and dynamic personality to support clients nationally.</p><p>Justin joined Cornerstone Discovery in 2021 as a Litigation Support Technician in the Trial Support Division. Justin was trained in comprehensive litigation support, in-court trial support, complex discovery support, and Cornerstone processes under the tutelage of senior trial technicians. Justin is actively consulting with clients and has been an in-court consultant in both Federal and State courts throughout Pennsylvania and New Jersey.</p><p>When not at trial, Justin is assisting clients in the areas of Digital Forensics, E-Discovery and Digital Media at Cornerstone. Justin's digital forensic degree is being put to good use, performing cell phone/DVR extractions and conducting Cellebrite searches regularly. Justin is also performing
    video analysis and discovery management on complex cases both in the civil and criminal arenas. Having obtained the distinguished rank of Eagle Scout, the highest rank attainable in Scouts, Justin is eager to showcase his hardworking and dedicated character to his clients. A native of Pennsylvania, Justin considers himself an avid outdoor enthusiast that enjoys swimming, kayaking, hiking and camping. Justin was a collegiate swimmer and, while not competing anymore, still enjoys the sport.</p>
- first: Kelvy
  last: Gomez
  position: Litigation Support Specialist
  image: /uploads/2025/11/Kelvy-Landscape-Photo-1000-x-353-px-1.png
  bio: <p>Enter Kelvy Gomez, a graduate of Bloomsburg University with a Bachelor of Science in Digital Forensics and Cybersecurity.</p><p>Kelvy joined Cornerstone Discovery in May 2023 as a Litigation Support Technician, drawing on his prior experience as an IT technician. That strong technical foundation laid the groundwork for his success at Cornerstone, enabling him to quickly master complex systems and manage large datasets with precision and efficiency. A key contributor to the e-Discovery department, Kelvy combines technical execution with high-touch client support. He actively manages e-Discovery cases, streamlines workflows, and trains new users on the firm’s document review platform. He also provides on-site trial preparation and in-court support for criminal and civil matters in state and federal courts nationwide.</p><p>Kelvy is the first in his family to graduate from college, is bilingual in English and Spanish, and is naturally motivated by new challenges and opportunities to expand his skill set. Outside of work, he has a lifelong passion for sports. He has played soccer since age five, competed in Europe against professional youth academies, and represented Eastern Pennsylvania in the Olympic Development Program. An avid Muay Thai and Jiu-Jitsu practitioner, he also enjoys traveling, spending time with family, listening to music, and watching psychological thrillers and supernatural horror films. Whether solving complex data challenges in e-Discovery or learning a new skill, Kelvy brings a disciplined, detail-oriented approach to everything he does.</p>
- first: Julian
  last: Nadachowski
  position: Litigation Support Technician
  image: /uploads/2025/11/Julian-Landscape-Photo-1000-x-353-px-1.png
  bio: <p>With the first pick of the draft, Cornerstone Discovery selects Julian Nadachowski. Linebacker (LB). Bloomsburg University. No joke! Julian attended Bloomsburg University and received a Bachelor of Science degree in Digital Forensics and Cyber Security. While pursuing his degree, Julian was a 5-year player and played linebacker for the Division II Bloomsburg Huskies.</p><p>Prior to joining Cornerstone Discovery, Julian completed an extensive internship with the Chester County Detectives’ Forensic Unit. There he gained valuable experience in digital forensics, working with various electronic devices, analyzing data, and using forensic software such as Axiom and Cellebrite.</p><p>Julian joined Cornerstone Discovery in August of 2024 as a Litigation Support Technician and started on day 1. As a Litigation Support Technician with Cornerstone Discovery, Julian provides cross-functional support by assisting all teams with incoming e-discovery requests. Within months of joining Cornerstone
    Discovery, Julian has established himself as a key team member, taking ownership of discovery management on cases and effectively tracking progress on larger projects. Julian has been a key contributor to the expansion of the e-discovery department and its client base.</p><p>Julian plays two positions at Cornerstone Discovery. His technical knowledge and versatility allow him to support both the e-Discovery and Trial Support departments. If called on, Julian also conducts in-court trial support. In this role, Julian performs trial preparation and in-court trial support for criminal and civil matters in state and federal courts around the country.</p><p>Growing up in Pennsylvania, Julian was a multisport athlete. He played football and was a First Team All-Chesmont LB and TE, plus a First Team All-Southeast PA LB. Today he is a die-hard Philadelphia sports fan and remains very active playing competitive sports. He runs, lifts weights, and plays organized flag football and pickleball,
    and he enjoys playing golf with friends. When relaxing, Julian plays guitar and loves spending time with his family and training his three dogs, which include two German Shepherds and one Belgian Malinois.</p>
