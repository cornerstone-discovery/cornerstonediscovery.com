# Every form on the site, ported field-for-field from the live Gravity Forms. Rendered by
# _includes/components/form.html and submitted to form-worker/ (which emails the fields in this order).
newsletter:
  fields:
  - type: html
    text: FOR TECH NEWS IN & OUT OF THE COURTROOM
  - type: email
    label: Email
    required: false
    placeholder: Email
    hide_label: true
  - type: captcha
  button: Subscribe Now
  gravity_form_id: 2
  live_pages: 114
contact:
  fields:
  - type: text
    label: Name
    required: true
  - type: text
    label: Company Name
    required: true
  - type: email
    label: Email
    required: true
  - type: tel
    label: Phone
    required: false
  - type: textarea
    label: Message
    required: false
  - type: captcha
  button: Submit
  gravity_form_id: 1
  live_pages:
  - contact
  title: Contact Us
  required_marker: '*'
  legend: '" * " indicates required fields'
